{# expects: action, values (dict), demo, button, file_note #}
<form method="post" action="{{ action }}" enctype="multipart/form-data" class="bg-white rounded-xl border p-4 sm:p-5 space-y-4 text-sm"
      onsubmit="this.querySelector('button[type=submit]').disabled=true; this.querySelector('button[type=submit]').textContent='Sending…'">
  <input type="hidden" name="demo" value="{{ demo }}">
  <div class="grid gap-2 sm:grid-cols-[11rem_1fr] lg:grid-cols-[12rem_1fr_12rem] sm:items-center sm:gap-4 rounded-lg border px-3 py-3 sm:py-2.5">
    <div class="font-medium">Bill (tax invoice)</div>
    <input type="file" name="invoice" aria-label="Bill (tax invoice)" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/*" class="text-xs min-w-0 max-w-full">
    <div class="text-xs text-slate-500 sm:col-span-2 lg:col-span-1 lg:text-right truncate empty:hidden">{{ file_note }}</div>
  </div>
  <div class="grid md:grid-cols-3 gap-4">
    <label class="block">Invoice number<input name="invoice_number" required value="{{ values.get('invoice_number', '') }}" class="mt-1 w-full rounded-md border px-3 py-2 mono uppercase"></label>
    <label class="block">Invoice date<input name="invoice_date" type="date" value="{{ values.get('invoice_date', '') }}" class="mt-1 w-full rounded-md border px-3 py-2"></label>
    <label class="block">Total amount, incl. GST (&#8377;)<input name="amount" required inputmode="decimal" value="{{ values.get('amount', '') }}" class="mt-1 w-full rounded-md border px-3 py-2 mono"></label>
    <label class="block md:col-span-3">What was the work?<input name="description" required value="{{ values.get('description', '') }}" class="mt-1 w-full rounded-md border px-3 py-2"></label>
    <label class="block md:col-span-2">Who at {{ BUYER.legal_name.split(' Private')[0] }} asked for it?<input name="engaged_by" required value="{{ values.get('engaged_by', '') }}" placeholder="Their name or work email" class="mt-1 w-full rounded-md border px-3 py-2">
      <span class="block text-xs text-slate-500 mt-1">They confirm the work before the bill is approved.</span></label>
    <label class="block">PO number <span class="text-slate-400">(if any)</span><input name="po_number" value="{{ values.get('po_number', '') }}" class="mt-1 w-full rounded-md border px-3 py-2 mono uppercase"></label>
  </div>
  <div class="flex flex-col-reverse sm:flex-row sm:items-center justify-between gap-3">
    <p class="text-xs text-slate-500 max-w-md">Payment goes only to the bank account we verified when you registered.</p>
    <button type="submit" class="w-full sm:w-auto rounded-md bg-indigo-600 text-white font-medium px-6 py-3 hover:bg-indigo-700 shadow-[3px_3px_0_rgba(28,27,24,.18)]">{{ button }}</button>
  </div>
</form>
