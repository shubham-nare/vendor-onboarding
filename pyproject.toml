[project]
name = "vendor-onboarding"
version = "0.1.0"
description = "Vendor onboarding readiness review: from submission to an explainable approval decision (Zamp ASA case study, PS-2)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "google-genai>=2.3",
    "rapidfuzz>=3.10",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "pypdf>=5.1",
    "pillow>=13.0.0",
    "asn1crypto>=1.5.1",
    "cryptography>=50.0.2",
    "pymupdf>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
