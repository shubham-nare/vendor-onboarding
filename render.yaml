# Render Blueprint: one free web service.
services:
  - type: web
    name: vendor-onboarding
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn onboarding.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.9"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSCODE
        generateValue: true
      # signs login and person-switcher cookies; the app refuses to start without it on a remote database
      - key: SESSION_SECRET
        generateValue: true
      # demo mode only: the password of the seeded demo logins (none are created while it is unset)
      - key: DEMO_PASSWORD
        sync: false
